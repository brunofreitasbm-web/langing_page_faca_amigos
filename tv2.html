<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <style>
    :root {
      --pink: #F0196B;
      --pink-dark: #C81158;
      --teal: #2ECFB5;
      --teal-dark: #1FA893;
      --yellow: #FFE234;
      --dark: #1A3F35;
      --ink-soft: #4C6B62;
      --cream: #FFF9F1;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0E221C;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--dark);
    }

    body.hide-cursor { cursor: none !important; }

    /* ==========================================================================
       PALCO FIXO 1080x1920 (RETRATO) PARA A TV 50" DEITADA 90º
       A TV física fica em pé, mas o sinal chega em paisagem: o JS gira o palco
       90º (ou 270º) e escala para caber, seja a TV 720p, 1080p ou 4K.
       ========================================================================== */
    #tvCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: var(--cream);
    }

    /* ==========================================================================
       TOPO — FOTO DO CIRCUITO + FRASE QUE PARA O PAI NO CORREDOR
       ========================================================================== */
    .c-photo-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1180px;
      overflow: hidden;
      background: var(--dark);
      clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%);
    }

    .c-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease-out;
    }

    .c-slide.active { opacity: 1; }

    .c-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      transition: transform 8s ease-out;
    }

    .c-slide.active img { transform: scale(1.14); }

    .c-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(14, 34, 28, 0) 45%, rgba(14, 34, 28, 0.9) 100%);
    }

    .c-slide-copy {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 150px;
      z-index: 2;
      color: var(--white);
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease-out 0.35s, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s;
    }

    .c-slide.active .c-slide-copy {
      opacity: 1;
      transform: translateY(0);
    }

    .c-kicker {
      display: inline-block;
      background: var(--yellow);
      color: var(--dark);
      font-family: 'Fredoka One', cursive;
      font-size: 40px;
      padding: 10px 30px;
      border-radius: 999px;
      margin-bottom: 22px;
      transform: rotate(-2deg);
    }

    .c-headline {
      font-family: 'Fredoka One', cursive;
      font-size: 100px;
      line-height: 1.02;
      letter-spacing: -1px;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
    }

    .c-headline em {
      font-style: normal;
      color: var(--yellow);
    }

    .c-brand {
      position: absolute;
      top: 44px;
      left: 44px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 30px 12px 14px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .c-brand img { width: 64px; height: 64px; object-fit: contain; }

    .c-brand-title {
      font-family: 'Fredoka One', cursive;
      font-size: 40px;
      color: var(--pink);
      line-height: 1;
    }

    .c-brand-sub {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 22px;
      color: var(--teal-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Barra de progresso no topo da foto */
    .c-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 10px;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      z-index: 6;
    }

    .c-progress-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, var(--teal), var(--yellow), var(--pink));
    }

    .c-progress-fill.run { animation: progress-run var(--slide-ms, 7000ms) linear forwards; }

    @keyframes progress-run {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* ==========================================================================
       BASE — PREÇO EM FUNDO CLARO, MÍNIMO DE TEXTO
       ========================================================================== */
    .c-price-zone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 834px;
      padding: 130px 70px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      clip-path: polygon(0 11.3%, 100% 0, 100% 100%, 0 100%); /* acompanha a borda inclinada da foto */
      background:
        radial-gradient(circle at 80% 25%, rgba(255, 226, 52, 0.35) 0%, rgba(255, 226, 52, 0) 45%),
        radial-gradient(circle at 15% 90%, rgba(46, 207, 181, 0.18) 0%, rgba(46, 207, 181, 0) 50%),
        var(--cream);
    }

    .c-price {
      position: relative;
      display: flex;
      align-items: flex-start;
      font-family: 'Fredoka One', cursive;
      color: var(--pink);
      line-height: 0.85;
      overflow: hidden;
      padding: 10px 6px;
      animation: price-beat 6s ease-in-out infinite;
    }

    .c-price-cur { font-size: 90px; margin-top: 30px; margin-right: 10px; }
    .c-price-int { font-size: 270px; letter-spacing: -8px; }
    .c-price-dec { font-size: 100px; margin-top: 30px; }

    /* Brilho que atravessa o preço — movimento periférico capta o olhar de quem passa */
    .c-price::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.75) 50%, rgba(255, 255, 255, 0) 100%);
      transform: translateX(-150%) skewX(-12deg);
      animation: price-shine 6s ease-in-out infinite;
    }

    @keyframes price-shine {
      0%, 55% { transform: translateX(-150%) skewX(-12deg); }
      80%, 100% { transform: translateX(350%) skewX(-12deg); }
    }

    @keyframes price-beat {
      0%, 82%, 100% { transform: scale(1); }
      88% { transform: scale(1.05); }
      94% { transform: scale(0.99); }
    }

    .c-plans {
      display: flex;
      gap: 32px;
      width: 100%;
      margin-top: 30px;
    }

    .c-plan {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--white);
      border: 5px solid rgba(26, 63, 53, 0.1);
      border-radius: 34px;
      padding: 22px 10px;
      box-shadow: 0 14px 34px rgba(26, 63, 53, 0.1);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .c-plan.on {
      border-color: var(--pink);
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 20px 44px rgba(240, 25, 107, 0.25);
    }

    .c-plan-icon { font-size: 60px; line-height: 1; }

    .c-plan-time {
      font-family: 'Fredoka One', cursive;
      font-size: 96px;
      color: var(--dark);
      line-height: 1;
    }

    .c-plan-time small { font-size: 46px; }

    .c-plan-name {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 34px;
      color: var(--ink-soft);
    }

    .c-cta {
      margin-top: 40px;
      font-family: 'Fredoka One', cursive;
      font-size: 64px;
      color: var(--teal-dark);
      letter-spacing: 1px;
      text-align: center;
      white-space: nowrap;
    }

    .c-cta span {
      display: inline-block;
      opacity: 0.35;
      animation: beat-word 3s ease-in-out infinite;
    }

    .c-cta span:nth-child(2) { animation-delay: 1s; }
    .c-cta span:nth-child(3) { animation-delay: 2s; color: var(--pink); }

    @keyframes beat-word {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      15%, 30% { opacity: 1; transform: scale(1.1); }
    }

    .c-easy {
      margin-top: 16px;
      font-weight: 800;
      font-size: 34px;
      color: var(--ink-soft);
    }

    /* Faixa quadriculada de largada na borda inclinada */
    .c-flag {
      position: absolute;
      top: 1163px;
      left: -10px;
      width: 1120px;
      height: 34px;
      transform: rotate(-5deg);
      transform-origin: left top;
      background-image:
        linear-gradient(45deg, var(--dark) 25%, transparent 25%, transparent 75%, var(--dark) 75%),
        linear-gradient(45deg, var(--dark) 25%, transparent 25%, transparent 75%, var(--dark) 75%);
      background-size: 34px 34px;
      background-position: 0 0, 17px 17px;
      background-color: var(--white);
      z-index: 4;
    }

    /* HUD discreto: só aparece se mexer o mouse */
    .c-hud {
      position: absolute;
      top: 140px;
      right: 24px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body:not(.hide-cursor) .c-hud { opacity: 1; }

    .c-hud-btn {
      background: rgba(26, 63, 53, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--white);
      padding: 8px 18px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .c-hud-btn:hover { background: var(--pink); }

    /* Aviso de áudio bloqueado pelo navegador (some quando o som destrava) */
    .c-sound-hint {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
      display: none;
      background: rgba(26, 63, 53, 0.9);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      font-weight: 600;
    }

    .c-sound-hint.on { display: block; }
  </style>
</head>

<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NPDJ58XR" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div id="tvCanvas">

    <!-- FOTO + FRASE -->
    <section class="c-photo-zone" id="photoZone">
      <div class="c-brand">
        <img src="img/logo-simbolo.png" alt="FaçaAmigos" width="64" height="64">

    <div class="c-flag" aria-hidden="true"></div>

    <!-- PREÇO -->
    <aside class="c-price-zone">
      <div class="c-price" aria-label="R$ 48,00">
        <span class="c-price-cur">R$</span>

      <div class="c-plans">

    <nav class="c-hud" aria-label="Controles de Exibição">
      <button class="c-hud-btn" id="btnRotate">🔄 [R] Giro</button>
      <button class="c-hud-btn" id="btnFullscreen">⛶ [F] Tela Cheia</button>
      <button class="c-hud-btn" id="btnNext">⏭ [→] Próximo</button>
      <button class="c-hud-btn" id="btnSound">🔊 [S] Som</button>
    </nav>

    <div class="c-sound-hint" id="soundHint">🔇 Toque na tela para ligar o som</div>
  </div>

  <script>
    (function () {
      'use strict';

      // ----------------------------------------------------------------------
      // SLIDES 100% CIRCUITO — cada frase usa um padrão de persuasão:
      // pressuposição ("qual", não "se"), comando embutido, futuro vivido,
      // e alívio para quem cuida (o pai descansa enquanto a criança brinca).
      // plan: qual cartão de preço acende junto com a foto (20 = pelúcias, 30 = carrinhos).
      // ----------------------------------------------------------------------
      const SLIDES = [
        { image: 'img/circuito-bombeiro', pos: '50% 40%', plan: 30, sfx: 'sirene',
          kicker: '🚨 Sirene ligada', headline: 'Hoje ele é o <em>herói</em> do shopping.' },
        { image: 'img/circuito-frota-quiosque', pos: '50% 60%', plan: 30, sfx: 'buzina',
          kicker: 'Range Rover ou Lamborghini?', headline: 'Qual ele vai <em>escolher</em> hoje?' },
        { image: 'img/circuito-macaco', pos: '50% 55%', plan: 30, sfx: 'vroom',
          kicker: '🎮 Controle remoto com você', headline: 'Ele no volante.<br><em>Você no controle.</em>' },
        { image: 'img/circuito-equipe-capivara', pos: '50% 40%', plan: 20, sfx: 'plim',
          kicker: '🐾 Pelúcias gigantes', headline: 'Um abraço desse tamanho cabe em <em>20 minutos</em>.' },
        { image: 'img/circuito-bombeiro-h', pos: '50% 40%', plan: 30, sfx: 'plim',
          kicker: '📸 Guarda esse momento', headline: 'Essa fase passa rápido.<br><em>Esse sorriso fica.</em>' },
        { image: 'img/circuito-lamborghini-urus', pos: '50% 60%', plan: 30, sfx: 'vroom',
          kicker: '🏁 Passeio pelo shopping', headline: 'Você respira.<br><em>Ele acelera.</em>' },
        { image: 'img/circuito-frota-alinhada', pos: '50% 55%', plan: 20, sfx: 'buzina',
          kicker: '👉 Está tudo pronto aqui', headline: 'Pode deixar ele <em>escolher</em>.' },
        { image: 'img/circuito-carrinhos', pos: '30% 60%', plan: 30, sfx: 'tada',
          kicker: '⏱️ Daqui a 30 minutos…', headline: 'Você vai ouvir:<br><em>“De novo!”</em>' },
        { image: 'img/circuito-stitch-menina', pos: '50% 55%', plan: 20, sfx: 'plim',
          kicker: '🐾 Pelúcia que anda', headline: 'Qual pelúcia ela vai <em>escolher</em>?' },
        { image: 'img/circuito-cachorro-pelucia', pos: '50% 40%', plan: 20, sfx: 'plim',
          kicker: '🐶 Amigo de pelúcia', headline: 'Um amigo de pelúcia pra <em>passear</em>.' },
        { image: 'img/circuito-unicornio', pos: '50% 55%', plan: 20, sfx: 'tada',
          kicker: '🦄 Pronto pra passear', headline: 'Roxo, macio e <em>pronto pra galope</em>.' },
        { image: 'img/circuito-bebe-lamborghini', pos: '50% 50%', plan: 30, sfx: 'vroom',
          kicker: '🏎️ Primeira volta', headline: 'Primeira volta.<br><em>Primeiro sorriso.</em>' },
        { image: 'img/circuito-cachorro-buggy', pos: '50% 55%', plan: 20, sfx: 'buzina',
          kicker: '👉 Tem pra todo gosto', headline: 'Pelúcia ou buggy?<br><em>Ele decide.</em>' },
        { image: 'img/circuito-quiosque', pos: '50% 45%', plan: 30, sfx: 'tada',
          kicker: '📍 Aqui no corredor', headline: 'Te esperamos aqui,<br><em>no corredor</em>.' }
      ];

      const CONFIG = {
        slideDuration: 7000,     // 7s: tempo de um pai cruzar a frente do quiosque
        inactivityTimeout: 3500,
        rotationKey: 'fa-tv2-giro',
        soundKey: 'fa-tv2-som',
        bedLevel: 0.30,          // trilha de fundo bem abaixo dos efeitos
        sfxLevel: 0.90,
        bpm: 112                 // andamento alegre, mas sem pressa
      };

      const ROTATIONS = ['auto', '90', '270', '0'];

      const state = { index: -1, order: [], timer: null, rotation: loadRotation() };

      const dom = {
        canvas: document.getElementById('tvCanvas'),
        zone: document.getElementById('photoZone'),
        progress: document.getElementById('progressFill'),
        plans: document.querySelectorAll('.c-plan'),
        btnRotate: document.getElementById('btnRotate'),
        btnFullscreen: document.getElementById('btnFullscreen'),
        btnNext: document.getElementById('btnNext'),
        btnSound: document.getElementById('btnSound'),
        soundHint: document.getElementById('soundHint')
      };

      // ----------------------------------------------------------------------
      // SOM AMBIENTE — tudo sintetizado com Web Audio (zero arquivo para baixar)
      // Trilha: arpejo I–vi–IV–V em Dó (a progressão "feliz" de música infantil).
      // Efeitos: um por foto, sincronizado com a troca — a mudança de som é o que
      // faz a cabeça de quem passa virar (som constante o cérebro ignora em segundos).
      // Prioridade: ?som=0|1 na URL > escolha salva com a tecla S > ligado.
      // ----------------------------------------------------------------------
      const CHORDS = [
        { bass: 130.81, arp: [261.63, 329.63, 392.00, 523.25] }, // C
        { bass: 110.00, arp: [220.00, 261.63, 329.63, 440.00] }, // Am
        { bass:  87.31, arp: [174.61, 220.00, 261.63, 349.23] }, // F
        { bass:  98.00, arp: [196.00, 246.94, 293.66, 392.00] }  // G
      ];
      const ARP_PATTERN = [0, 1, 2, 3, 2, 1, 2, 1];

      const audio = { ctx: null, master: null, bed: null, sfx: null, on: loadSound(), step: 0, nextAt: 0, timer: null };

      function loadSound() {
        const fromUrl = new URLSearchParams(location.search).get('som');
        if (fromUrl === '0' || fromUrl === '1') return fromUrl === '1';
        try {
          const saved = localStorage.getItem(CONFIG.soundKey);
          if (saved === '0' || saved === '1') return saved === '1';
        } catch (e) { /* armazenamento bloqueado: segue ligado */ }
        return true;
      }

      function belemHour() {
        return new Date(Date.now() - 3 * 3600000).getUTCHours();
      }

      // Volume geral (0 a 1) conforme a hora de Belém (0–23).
      function volumeAgora(hora) {
        // Pico do shopping (18h–22h): mais ruído e mais pais passando
        if (hora >= 18 && hora < 22) return 0.8;
        return 0.6;
      }

      function initAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || audio.ctx) return;
        const ctx = audio.ctx = new AC();
        // Compressor segura os picos: buzina e sirene não estouram a caixa da TV
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.ratio.value = 6;
        audio.master = ctx.createGain();
        audio.bed = ctx.createGain();
        audio.sfx = ctx.createGain();
        audio.bed.gain.value = CONFIG.bedLevel;
        audio.sfx.gain.value = CONFIG.sfxLevel;
        audio.bed.connect(audio.master);
        audio.sfx.connect(audio.master);
        audio.master.connect(comp).connect(ctx.destination);
        applyVolume();
      }

      // Navegadores só liberam áudio após um gesto. Na TV, o Chrome em modo
      // quiosque com --autoplay-policy=no-user-gesture-required começa direto;
      // sem a flag, qualquer toque/tecla destrava.
      function unlockAudio() {
        initAudio();
        if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume().then(updateSoundHint);
        updateSoundHint();
      }

      function updateSoundHint() {
        const blocked = audio.on && (!audio.ctx || audio.ctx.state !== 'running');
        dom.soundHint.classList.toggle('on', blocked);
      }

      function applyVolume() {
        if (!audio.ctx) return;
        const v = audio.on ? Math.max(0, Math.min(1, volumeAgora(belemHour()))) : 0;
        audio.master.gain.setTargetAtTime(v, audio.ctx.currentTime, 0.4);
        dom.btnSound.textContent = audio.on ? `🔊 [S] Som ${Math.round(v * 100)}%` : '🔇 [S] Som';
      }

      function toggleSound() {
        // Se o navegador ainda segurava o áudio, o 1º toque só destrava (e garante ligado)
        if (!audio.ctx || audio.ctx.state !== 'running') {
          audio.on = true;
          try { localStorage.setItem(CONFIG.soundKey, '1'); } catch (e) { /* ignora */ }
          unlockAudio();
          applyVolume();
          return;
        }
        audio.on = !audio.on;
        try { localStorage.setItem(CONFIG.soundKey, audio.on ? '1' : '0'); } catch (e) { /* ignora */ }
        unlockAudio();
        applyVolume();
      }

      function tone(freq, at, dur, opt) {
        const o = Object.assign({ type: 'sine', gain: 0.2, to: null, dest: audio.sfx }, opt);
        const ctx = audio.ctx;
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = o.type;
        osc.frequency.setValueAtTime(freq, at);
        if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, at + dur);
        env.gain.setValueAtTime(0.0001, at);
        env.gain.exponentialRampToValueAtTime(o.gain, at + 0.015);
        env.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(env).connect(o.dest);
        osc.start(at);
        osc.stop(at + dur + 0.05);
        return osc;
      }

      const SFX = {
        sirene(t) {
          for (let i = 0; i < 2; i++) {
            tone(650, t + i * 0.6, 0.3, { type: 'triangle', gain: 0.25, to: 980 });
            tone(980, t + i * 0.6 + 0.3, 0.3, { type: 'triangle', gain: 0.25, to: 650 });
          }
        },
        buzina(t) {
          [0, 0.2].forEach(d => {
            tone(440, t + d, 0.13, { type: 'square', gain: 0.09 });
            tone(554, t + d, 0.13, { type: 'square', gain: 0.07 });
          });
        },
        vroom(t) {
          const ctx = audio.ctx;
          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 900;
          lp.connect(audio.sfx);
          const osc = tone(70, t, 1.1, { type: 'sawtooth', gain: 0.3, dest: lp });
          osc.frequency.exponentialRampToValueAtTime(240, t + 0.45);
          osc.frequency.exponentialRampToValueAtTime(130, t + 1.1);
        },
        plim(t) {
          tone(1318.5, t, 0.9, { gain: 0.18 });
          tone(1975.5, t + 0.08, 0.8, { gain: 0.12 });
        },
        tada(t) {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
            tone(f, t + i * 0.09, i === 3 ? 0.7 : 0.18, { type: 'triangle', gain: 0.2 }));
        }
      };

      function playSfx(name) {
        if (!audio.ctx || audio.ctx.state !== 'running' || !audio.on || !SFX[name]) return;
        const t = audio.ctx.currentTime + 0.05;
        // "Ducking": a trilha abaixa enquanto o efeito toca, como em locução de rádio
        audio.bed.gain.setTargetAtTime(CONFIG.bedLevel * 0.35, t, 0.05);
        audio.bed.gain.setTargetAtTime(CONFIG.bedLevel, t + 1.2, 0.4);
        SFX[name](t);
      }

      // Agendador com antecedência: marca as notas no relógio do áudio (preciso)
      // em vez de confiar no setInterval (que atrasa quando a TV está ocupada).
      function scheduleBed() {
        if (!audio.ctx || audio.ctx.state !== 'running') return;
        const eighth = 60 / CONFIG.bpm / 2;
        if (audio.nextAt < audio.ctx.currentTime) audio.nextAt = audio.ctx.currentTime + 0.1;
        while (audio.nextAt < audio.ctx.currentTime + 0.5) {
          const chord = CHORDS[Math.floor(audio.step / 8) % CHORDS.length];
          const pos = audio.step % 8;
          tone(chord.arp[ARP_PATTERN[pos]], audio.nextAt, eighth * 1.6, { type: 'triangle', gain: 0.12, dest: audio.bed });
          if (pos === 0 || pos === 4) tone(chord.bass, audio.nextAt, eighth * 3.5, { gain: 0.22, dest: audio.bed });
          audio.nextAt += eighth;
          audio.step++;
        }
      }

      // ----------------------------------------------------------------------
      // GIRO 90º + ESCALA DO PALCO 1080x1920
      // Prioridade: ?giro=90|270|0 na URL > escolha salva com a tecla R > auto.
      // Auto: sinal em paisagem (TV deitada) gira 90º horário; retrato não gira.
      // ----------------------------------------------------------------------
      function loadRotation() {
        const fromUrl = new URLSearchParams(location.search).get('giro');
        if (ROTATIONS.indexOf(fromUrl) !== -1) return fromUrl;
        try {
          const saved = localStorage.getItem(CONFIG.rotationKey);
          if (ROTATIONS.indexOf(saved) !== -1) return saved;
        } catch (e) { /* armazenamento bloqueado: segue no auto */ }
        return 'auto';
      }

      function fitCanvas() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        let deg = state.rotation === 'auto' ? (w > h ? 90 : 0) : Number(state.rotation);
        const sideways = deg === 90 || deg === 270;
        const scale = sideways ? Math.min(w / 1920, h / 1080) : Math.min(w / 1080, h / 1920);
        dom.canvas.style.transform = `translate(-50%, -50%) rotate(${deg}deg) scale(${scale})`;
        dom.btnRotate.textContent = `🔄 [R] Giro: ${state.rotation === 'auto' ? 'auto (' + deg + 'º)' : deg + 'º'}`;
      }

      function cycleRotation() {
        state.rotation = ROTATIONS[(ROTATIONS.indexOf(state.rotation) + 1) % ROTATIONS.length];
        try { localStorage.setItem(CONFIG.rotationKey, state.rotation); } catch (e) { /* ignora */ }
        fitCanvas();
      }

      // ----------------------------------------------------------------------
      // EMBARALHAMENTO (Fisher-Yates) sem repetir a última foto na virada
      // ----------------------------------------------------------------------
      function shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function buildSlides() {
        SLIDES.forEach((s, i) => {
          const el = document.createElement('div');
          el.className = 'c-slide';
          el.innerHTML = `
            <img src="${s.image}.webp" alt="" width="1080" height="1180" decoding="async" style="object-position:${s.pos}">
            <div class="c-slide-copy">
              <div class="c-kicker">${s.kicker}</div>
              <h1 class="c-headline">${s.headline}</h1>
            </div>
          `;
          // Fallback para TVs sem suporte a WebP
          el.querySelector('img').addEventListener('error', function onErr(e) {
            e.target.removeEventListener('error', onErr);
            e.target.src = s.image + '.jpg';
          });
          dom.zone.insertBefore(el, dom.zone.querySelector('.c-progress'));
          SLIDES[i].el = el;
        });
      }

      function nextOrder() {
        let order = shuffle(SLIDES.map((_, i) => i));
        const last = state.order[state.order.length - 1];
        if (order[0] === last && order.length > 1) order.push(order.shift());
        return order;
      }

      function show() {
        clearTimeout(state.timer);

        if (state.index >= 0) SLIDES[state.order[state.index]].el.classList.remove('active');
        state.index++;
        if (state.index >= state.order.length) {
          state.order = nextOrder();
          state.index = 0;
        }

        const slide = SLIDES[state.order[state.index]];
        slide.el.classList.add('active');
        dom.plans.forEach(p => p.classList.toggle('on', Number(p.dataset.plan) === slide.plan));
        playSfx(slide.sfx);

        // Reinicia a animação da barra (CSS, sem custo de JS por frame)
        dom.progress.classList.remove('run');
        void dom.progress.offsetWidth;
        dom.progress.classList.add('run');

        state.timer = setTimeout(show, CONFIG.slideDuration);
      }

      // ----------------------------------------------------------------------
      // CONTROLES
      // ----------------------------------------------------------------------
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      dom.btnRotate.addEventListener('click', cycleRotation);
      dom.btnFullscreen.addEventListener('click', toggleFullscreen);
      dom.btnNext.addEventListener('click', show);
      dom.btnSound.addEventListener('click', toggleSound);

      ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
        window.addEventListener(ev, unlockAudio, { passive: true }));

      window.addEventListener('keydown', (e) => {
        const k = e.key.toUpperCase();
        if (k === 'S') toggleSound();
        else if (k === 'R') cycleRotation();
        else if (k === 'F') toggleFullscreen();
        else if (k === 'ARROWRIGHT' || k === 'N') show();
      });

      document.body.addEventListener('dblclick', (e) => {
        if (!e.target.closest('.c-hud')) toggleFullscreen();
      });

      let cursorTimeout;
      function resetCursorTimer() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimeout);
        cursorTimeout = setTimeout(() => document.body.classList.add('hide-cursor'), CONFIG.inactivityTimeout);
      }
      window.addEventListener('mousemove', resetCursorTimer);
      window.addEventListener('touchstart', resetCursorTimer, { passive: true });
      window.addEventListener('resize', fitCanvas);

      // Recarrega 1x por dia de madrugada (06h de Belém) para puxar atualizações e liberar memória
      const bootDay = Math.floor((Date.now() - 3 * 3600000) / 86400000);
      setInterval(() => {
        const belem = new Date(Date.now() - 3 * 3600000);
        const day = Math.floor(belem.getTime() / 86400000);
        if (day !== bootDay && belem.getUTCHours() === 6) location.reload();
      }, 60000);

      // Inicialização — começa sozinha, sem nenhum comando
      document.documentElement.style.setProperty('--slide-ms', CONFIG.slideDuration + 'ms');
      fitCanvas();
      resetCursorTimer();
      unlockAudio();
      setInterval(scheduleBed, 150);
      setInterval(applyVolume, 60000);
      buildSlides();
      state.order = nextOrder();
      show();
    })();
  </script>
</body>

</html>
