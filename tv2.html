<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="/assets/fa-track.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FaçaAmigos Circuito TV2</title>
  <meta name="description" content="Vitrine Digital da TV 50&quot; do Quiosque do Circuito de Carrinhos Elétricos FaçaAmigos no Parque Shopping Belém.">
  <link rel="canonical" href="https://institutofacaamigos.com.br/tv2">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="img/logo-simbolo.png">

  <!-- Fontes Oficiais da Marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #F0196B;
      --pink-dark: #C81158;
      --teal: #2ECFB5;
      --teal-dark: #1FA893;
      --yellow: #FFE234;
      --dark: #1A3F35;
      --ink-soft: #4C6B62;
      --cream: #FFF9F1;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0E221C;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--dark);
    }

    body.hide-cursor { cursor: none !important; }

    /* ==========================================================================
       PALCO FIXO 1920x1080 ESCALADO PARA QUALQUER TV 16:9 (50" DEITADA / PAISAGEM)
       O navegador da TV pode reportar 1280x720, 1920x1080 ou 3840x2160 —
       desenhamos em pixels fixos e escalamos o conjunto inteiro via transform.
       ========================================================================== */
    #tvCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(var(--fit, 1));
      overflow: hidden;
      background: var(--cream);
    }

    /* ==========================================================================
       LADO ESQUERDO — FOTO DO CIRCUITO + FRASE QUE PARA O PAI NO CORREDOR
       ========================================================================== */
    .c-photo-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 1180px;
      height: 1080px;
      overflow: hidden;
      background: var(--dark);
      clip-path: polygon(0 0, 100% 0, 91.5% 100%, 0 100%);
    }

    .c-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease-out;
    }

    .c-slide.active { opacity: 1; }

    .c-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      transition: transform 8s ease-out;
    }

    .c-slide.active img { transform: scale(1.14); }

    .c-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(14, 34, 28, 0) 38%, rgba(14, 34, 28, 0.88) 100%);
    }

    .c-slide-copy {
      position: absolute;
      left: 72px;
      right: 170px;
      bottom: 92px;
      z-index: 2;
      color: var(--white);
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease-out 0.35s, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s;
    }

    .c-slide.active .c-slide-copy {
      opacity: 1;
      transform: translateY(0);
    }

    .c-kicker {
      display: inline-block;
      background: var(--yellow);
      color: var(--dark);
      font-family: 'Fredoka One', cursive;
      font-size: 40px;
      padding: 10px 30px;
      border-radius: 999px;
      margin-bottom: 22px;
      transform: rotate(-2deg);
    }

    .c-headline {
      font-family: 'Fredoka One', cursive;
      font-size: 104px;
      line-height: 1.02;
      letter-spacing: -1px;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
    }

    .c-headline em {
      font-style: normal;
      color: var(--yellow);
    }

    .c-brand {
      position: absolute;
      top: 40px;
      left: 48px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 30px 12px 14px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .c-brand img { width: 64px; height: 64px; object-fit: contain; }

    .c-brand-title {
      font-family: 'Fredoka One', cursive;
      font-size: 40px;
      color: var(--pink);
      line-height: 1;
    }

    .c-brand-sub {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 22px;
      color: var(--teal-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Barra de progresso no pé da foto */
    .c-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 10px;
      width: 100%;
      background: rgba(255, 255, 255, 0.15);
      z-index: 6;
    }

    .c-progress-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, var(--teal), var(--yellow), var(--pink));
    }

    .c-progress-fill.run { animation: progress-run var(--slide-ms, 7000ms) linear forwards; }

    @keyframes progress-run {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* ==========================================================================
       LADO DIREITO — PREÇO EM FUNDO CLARO, MÍNIMO DE TEXTO
       ========================================================================== */
    .c-price-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 840px;
      height: 1080px;
      padding: 70px 70px 60px 150px;
      clip-path: polygon(11.9% 0, 100% 0, 100% 100%, 0 100%); /* acompanha a borda inclinada da foto */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 70% 18%, rgba(255, 226, 52, 0.35) 0%, rgba(255, 226, 52, 0) 45%),
        radial-gradient(circle at 30% 90%, rgba(46, 207, 181, 0.18) 0%, rgba(46, 207, 181, 0) 50%),
        var(--cream);
    }

    .c-price {
      position: relative;
      display: flex;
      align-items: flex-start;
      font-family: 'Fredoka One', cursive;
      color: var(--pink);
      line-height: 0.85;
      overflow: hidden;
      padding: 10px 6px;
      animation: price-beat 6s ease-in-out infinite;
    }

    .c-price-cur { font-size: 96px; margin-top: 34px; margin-right: 10px; }
    .c-price-int { font-size: 300px; letter-spacing: -8px; }
    .c-price-dec { font-size: 110px; margin-top: 34px; }

    /* Brilho que atravessa o preço — movimento periférico capta o olhar de quem passa */
    .c-price::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.75) 50%, rgba(255, 255, 255, 0) 100%);
      transform: translateX(-150%) skewX(-12deg);
      animation: price-shine 6s ease-in-out infinite;
    }

    @keyframes price-shine {
      0%, 55% { transform: translateX(-150%) skewX(-12deg); }
      80%, 100% { transform: translateX(350%) skewX(-12deg); }
    }

    @keyframes price-beat {
      0%, 82%, 100% { transform: scale(1); }
      88% { transform: scale(1.05); }
      94% { transform: scale(0.99); }
    }

    .c-plans {
      display: flex;
      gap: 28px;
      width: 100%;
      margin-top: 44px;
    }

    .c-plan {
      flex: 1;
      background: var(--white);
      border: 5px solid rgba(26, 63, 53, 0.1);
      border-radius: 34px;
      padding: 26px 10px 24px;
      text-align: center;
      box-shadow: 0 14px 34px rgba(26, 63, 53, 0.1);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .c-plan.on {
      border-color: var(--pink);
      transform: translateY(-10px) scale(1.04);
      box-shadow: 0 20px 44px rgba(240, 25, 107, 0.25);
    }

    .c-plan-icon { font-size: 64px; line-height: 1; }

    .c-plan-time {
      font-family: 'Fredoka One', cursive;
      font-size: 108px;
      color: var(--dark);
      line-height: 1;
      margin-top: 8px;
    }

    .c-plan-time small { font-size: 52px; }

    .c-plan-name {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 36px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    .c-cta {
      margin-top: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 54px;
      color: var(--teal-dark);
      letter-spacing: 1px;
      text-align: center;
    }

    .c-cta span {
      display: inline-block;
      opacity: 0.35;
      animation: beat-word 3s ease-in-out infinite;
    }

    .c-cta span:nth-child(2) { animation-delay: 1s; }
    .c-cta span:nth-child(3) { animation-delay: 2s; color: var(--pink); }

    @keyframes beat-word {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      15%, 30% { opacity: 1; transform: scale(1.1); }
    }

    .c-easy {
      margin-top: 18px;
      font-weight: 800;
      font-size: 30px;
      color: var(--ink-soft);
    }

    /* Faixa quadriculada de largada na borda inclinada */
    .c-flag {
      position: absolute;
      top: -20px;
      left: 1164px;
      width: 34px;
      height: 1120px;
      transform: rotate(5.3deg);
      transform-origin: top left;
      background-image:
        linear-gradient(45deg, var(--dark) 25%, transparent 25%, transparent 75%, var(--dark) 75%),
        linear-gradient(45deg, var(--dark) 25%, transparent 25%, transparent 75%, var(--dark) 75%);
      background-size: 34px 34px;
      background-position: 0 0, 17px 17px;
      background-color: var(--white);
      z-index: 4;
    }

    /* HUD discreto: só aparece se mexer o mouse */
    .c-hud {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 50;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body:not(.hide-cursor) .c-hud { opacity: 1; }

    .c-hud-btn {
      background: rgba(26, 63, 53, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--white);
      padding: 8px 18px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .c-hud-btn:hover { background: var(--pink); }
  </style>
</head>

<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NPDJ58XR" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div id="tvCanvas">

    <!-- FOTO + FRASE -->
    <section class="c-photo-zone" id="photoZone">
      <div class="c-brand">
        <img src="img/logo-simbolo.png" alt="FaçaAmigos" width="64" height="64">
        <div>
          <div class="c-brand-title">FaçaAmigos</div>
          <div class="c-brand-sub">Circuito de Carrinhos</div>
        </div>
      </div>
      <!-- Slides inseridos via JavaScript -->
      <div class="c-progress"><div class="c-progress-fill" id="progressFill"></div></div>
    </section>

    <div class="c-flag" aria-hidden="true"></div>

    <!-- PREÇO -->
    <aside class="c-price-zone">
      <div class="c-price" aria-label="R$ 48,00">
        <span class="c-price-cur">R$</span>
        <span class="c-price-int">48</span>
        <span class="c-price-dec">,00</span>
      </div>

      <div class="c-plans">
        <div class="c-plan" data-plan="20">
          <div class="c-plan-icon">🐾</div>
          <div class="c-plan-time">20<small>min</small></div>
          <div class="c-plan-name">Pelúcias</div>
        </div>
        <div class="c-plan" data-plan="30">
          <div class="c-plan-icon">🏎️</div>
          <div class="c-plan-time">30<small>min</small></div>
          <div class="c-plan-name">Carrinhos</div>
        </div>
      </div>

      <div class="c-cta"><span>Escolhe.</span> <span>Senta.</span> <span>Acelera!</span></div>
      <div class="c-easy">Sem agendamento • é só chegar 👈</div>
    </aside>

    <nav class="c-hud" aria-label="Controles de Exibição">
      <button class="c-hud-btn" id="btnFullscreen">⛶ [F] Tela Cheia</button>
      <button class="c-hud-btn" id="btnNext">⏭ [→] Próximo</button>
    </nav>
  </div>

  <script>
    (function () {
      'use strict';

      // ----------------------------------------------------------------------
      // SLIDES 100% CIRCUITO — cada frase usa um padrão de persuasão:
      // pressuposição ("qual", não "se"), comando embutido, futuro vivido,
      // e alívio para quem cuida (o pai descansa enquanto a criança brinca).
      // plan: qual cartão de preço acende junto com a foto (20 = pelúcias, 30 = carrinhos).
      // ----------------------------------------------------------------------
      const SLIDES = [
        { image: 'img/circuito-bombeiro-h', pos: '50% 40%', plan: 30,
          kicker: '🚨 Sirene ligada', headline: 'Hoje ele é o <em>herói</em> do shopping.' },
        { image: 'img/circuito-carrinhos', pos: '50% 60%', plan: 30,
          kicker: 'Range Rover ou Lamborghini?', headline: 'Qual ele vai <em>escolher</em> hoje?' },
        { image: 'img/circuito-macaco', pos: '50% 65%', plan: 30,
          kicker: '🎮 Controle remoto com você', headline: 'Ele no volante.<br><em>Você no controle.</em>' },
        { image: 'img/circuito-equipe-capivara', pos: '50% 45%', plan: 20,
          kicker: '🐾 Pelúcias gigantes', headline: 'Um abraço desse tamanho cabe em <em>20 minutos</em>.' },
        { image: 'img/circuito-bombeiro', pos: '50% 55%', plan: 30,
          kicker: '📸 Guarda esse momento', headline: 'Essa fase passa rápido.<br><em>Esse sorriso fica.</em>' },
        { image: 'img/circuito-lamborghini-urus', pos: '50% 60%', plan: 30,
          kicker: '🏁 Passeio pelo shopping', headline: 'Você respira.<br><em>Ele acelera.</em>' },
        { image: 'img/circuito-frota-alinhada', pos: '50% 55%', plan: 20,
          kicker: '👉 Está tudo pronto aqui', headline: 'Pode deixar ele <em>escolher</em>.' },
        { image: 'img/circuito-frota-quiosque', pos: '50% 60%', plan: 30,
          kicker: '⏱️ Daqui a 30 minutos…', headline: 'Você vai ouvir:<br><em>“De novo!”</em>' }
      ];

      const CONFIG = {
        slideDuration: 7000,     // 7s: tempo de um pai cruzar a frente do quiosque
        inactivityTimeout: 3500
      };

      const state = { index: -1, order: [], timer: null };

      const dom = {
        canvas: document.getElementById('tvCanvas'),
        zone: document.getElementById('photoZone'),
        progress: document.getElementById('progressFill'),
        plans: document.querySelectorAll('.c-plan'),
        btnFullscreen: document.getElementById('btnFullscreen'),
        btnNext: document.getElementById('btnNext')
      };

      // ----------------------------------------------------------------------
      // ESCALA DO PALCO 1920x1080 PARA A TELA REAL
      // ----------------------------------------------------------------------
      function fitCanvas() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        dom.canvas.style.setProperty('--fit', scale);
      }

      // ----------------------------------------------------------------------
      // EMBARALHAMENTO (Fisher-Yates) sem repetir a última foto na virada
      // ----------------------------------------------------------------------
      function shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function buildSlides() {
        SLIDES.forEach((s, i) => {
          const el = document.createElement('div');
          el.className = 'c-slide';
          el.innerHTML = `
            <img src="${s.image}.webp" alt="" width="1180" height="1080" decoding="async" style="object-position:${s.pos}">
            <div class="c-slide-copy">
              <div class="c-kicker">${s.kicker}</div>
              <h1 class="c-headline">${s.headline}</h1>
            </div>
          `;
          // Fallback para TVs sem suporte a WebP
          el.querySelector('img').addEventListener('error', function onErr(e) {
            e.target.removeEventListener('error', onErr);
            e.target.src = s.image + '.jpg';
          });
          dom.zone.insertBefore(el, dom.zone.querySelector('.c-progress'));
          SLIDES[i].el = el;
        });
      }

      function nextOrder() {
        let order = shuffle(SLIDES.map((_, i) => i));
        const last = state.order[state.order.length - 1];
        if (order[0] === last && order.length > 1) order.push(order.shift());
        return order;
      }

      function show() {
        clearTimeout(state.timer);

        if (state.index >= 0) SLIDES[state.order[state.index]].el.classList.remove('active');
        state.index++;
        if (state.index >= state.order.length) {
          state.order = nextOrder();
          state.index = 0;
        }

        const slide = SLIDES[state.order[state.index]];
        slide.el.classList.add('active');
        dom.plans.forEach(p => p.classList.toggle('on', Number(p.dataset.plan) === slide.plan));

        // Reinicia a animação da barra (CSS, sem custo de JS por frame)
        dom.progress.classList.remove('run');
        void dom.progress.offsetWidth;
        dom.progress.classList.add('run');

        state.timer = setTimeout(show, CONFIG.slideDuration);
      }

      // ----------------------------------------------------------------------
      // CONTROLES
      // ----------------------------------------------------------------------
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      dom.btnFullscreen.addEventListener('click', toggleFullscreen);
      dom.btnNext.addEventListener('click', show);

      window.addEventListener('keydown', (e) => {
        const k = e.key.toUpperCase();
        if (k === 'F') toggleFullscreen();
        else if (k === 'ARROWRIGHT' || k === 'N') show();
      });

      document.body.addEventListener('dblclick', (e) => {
        if (!e.target.closest('.c-hud')) toggleFullscreen();
      });

      let cursorTimeout;
      function resetCursorTimer() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimeout);
        cursorTimeout = setTimeout(() => document.body.classList.add('hide-cursor'), CONFIG.inactivityTimeout);
      }
      window.addEventListener('mousemove', resetCursorTimer);
      window.addEventListener('touchstart', resetCursorTimer, { passive: true });
      window.addEventListener('resize', fitCanvas);

      // Recarrega 1x por dia de madrugada (06h de Belém) para puxar atualizações e liberar memória
      const bootDay = Math.floor((Date.now() - 3 * 3600000) / 86400000);
      setInterval(() => {
        const belem = new Date(Date.now() - 3 * 3600000);
        const day = Math.floor(belem.getTime() / 86400000);
        if (day !== bootDay && belem.getUTCHours() === 6) location.reload();
      }, 60000);

      // Inicialização — começa sozinha, sem nenhum comando
      document.documentElement.style.setProperty('--slide-ms', CONFIG.slideDuration + 'ms');
      fitCanvas();
      resetCursorTimer();
      buildSlides();
      state.order = nextOrder();
      show();
    })();
  </script>
</body>

</html>
