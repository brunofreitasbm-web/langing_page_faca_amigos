<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FaçaAmigos — Wi-Fi</title>
<meta name="robots" content="noindex, nofollow">
<!--
  rlogin.html é servido pelo RouterOS a quem AINDA NÃO ENTROU e abriu um endereço fora do
  walled garden. A função dele é só mandar o visitante para o login.html, preservando o
  endereço pedido. Não é a tela de "voltou de cookie" e não envia usuário nem senha: a
  reconexão automática é feita pelo próprio roteador (login-by=cookie, ver
  LEIA-ME-HOTSPOT.md, seção 5).
-->
<meta http-equiv="refresh" content="0; url=$(link-login-only)?dst=$(link-orig-esc)">
<style>
  :root { --pink: #F0196B; --dark: #1A3F35; --ink-soft: #4C6B62; --cream: #FFF9F1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', 'Segoe UI', sans-serif; color: var(--dark); background: var(--cream); display: flex; align-items: center; justify-content: center; height: 100vh; }
  .wrap { text-align: center; padding: 0 20px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .logo-row img { width: 40px; height: 40px; border-radius: 50%; }
  .logo-row span { font-family: 'Fredoka One', sans-serif; font-size: 18px; }
  .logo-row .amigos { color: var(--pink); } .logo-row .faca { color: var(--dark); }
  p { color: var(--ink-soft); font-size: 14px; }
  a { color: var(--pink); font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.png" alt="FaçaAmigos" onerror="this.style.display='none'">
    <span><span class="faca">Faça</span><span class="amigos">Amigos</span></span>
  </div>
  <p>Abrindo o cadastro do Wi-Fi... <a href="$(link-login-only)?dst=$(link-orig-esc)">Toque aqui se não abrir</a></p>
</div>
</body>
</html>
