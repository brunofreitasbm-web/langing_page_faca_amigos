<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Até logo! — FaçaAmigos</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --pink: #E01560; --pink-dark: #C81158; --teal: #2ECFB5; --dark: #1A3F35;
    --ink-soft: #4C6B62; --cream: #FFF9F1; --white: #FFFFFF;
    --shadow-sm: 0 4px 10px rgba(26, 63, 53, 0.08);
    --shadow-lg: 0 18px 40px rgba(26, 63, 53, 0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Nunito', 'Segoe UI', sans-serif; color: var(--dark); background: var(--cream); line-height: 1.5; }
  h1 { font-family: 'Fredoka One', 'Nunito', sans-serif; font-weight: 400; font-size: 20px; margin-bottom: 8px; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 40px 18px; text-align: center; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .logo-row img { width: 40px; height: 40px; border-radius: 50%; }
  .logo-row span { font-family: 'Fredoka One', sans-serif; font-size: 18px; }
  .logo-row .amigos { color: var(--pink); } .logo-row .faca { color: var(--dark); }
  .card { background: var(--white); border-radius: 24px; box-shadow: var(--shadow-lg); padding: 26px 20px; }
  p { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 18px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--pink); color: var(--white); border-radius: 999px; padding: 14px 22px; text-decoration: none; font-family: 'Fredoka One', sans-serif; font-size: 15px; box-shadow: 0 10px 26px rgba(240,25,107,0.32); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.png" alt="FaçaAmigos" onerror="this.style.display='none'">
    <span><span class="faca">Faça</span><span class="amigos">Amigos</span></span>
  </div>
  <div class="card">
    <h1>Sua sessão foi encerrada</h1>
    <p>Obrigado por passar pela FaçaAmigos! Reconecte quando quiser — e não esquece do seu cupom ESPERA no seu e-mail.</p>
    <a class="btn" href="https://institutofacaamigos.com.br/wifi?utm_source=wifi&amp;utm_medium=captive_portal&amp;utm_campaign=clinica_fatima&amp;utm_content=logout" target="_blank" rel="noopener">Ver meus benefícios</a>
  </div>
</div>
</body>
</html>
