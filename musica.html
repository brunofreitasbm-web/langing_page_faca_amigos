<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="/assets/fa-track.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FaçaAmigos — Rádio de Músicas do Salão</title>
  <meta name="description" content="Player único e automático de músicas do FaçaAmigos Playground. Rotação aleatória contínua e direta, sem complicações.">
  <link rel="canonical" href="https://institutofacaamigos.com.br/musica">
  <link rel="icon" type="image/png" href="img/logo-simbolo.png">

  <!-- Fontes Oficiais da Marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #F0196B;
      --pink-dark: #C81158;
      --pink-soft: rgba(240, 25, 107, 0.15);
      --teal: #2ECFB5;
      --teal-dark: #1FA893;
      --teal-soft: rgba(46, 207, 181, 0.15);
      --yellow: #FFE234;
      --yellow-dark: #F59E0B;
      --dark: #1A3F35;
      --dark-card: rgba(26, 63, 53, 0.92);
      --bg: #0D201A;
      --white: #FFFFFF;
      --border-glass: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 20% 15%, rgba(240, 25, 107, 0.18), transparent 45%),
                  radial-gradient(circle at 80% 85%, rgba(46, 207, 181, 0.22), transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(255, 226, 52, 0.08), transparent 60%),
                  var(--bg);
      background-attachment: fixed;
      font-family: 'Nunito', sans-serif;
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 40px;
    }

    /* TOPBAR COMPACTA */
    .topbar {
      width: 100%;
      max-width: 660px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .brand-text b {
      display: block;
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--yellow);
      line-height: 1;
    }

    .brand-text span {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: var(--teal);
      text-transform: uppercase;
    }

    .btn-tv {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-glass);
      color: var(--white);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-tv:hover {
      background: var(--pink);
      border-color: var(--pink);
      transform: translateY(-1px);
    }

    /* CARD DO PLAYER ÚNICO (CENTRAL E SEM CONFUSÃO) */
    .player-card {
      width: 100%;
      max-width: 660px;
      background: var(--dark-card);
      border: 1px solid var(--border-glass);
      border-radius: 32px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* BADGE DE STATUS */
    .radio-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(46, 207, 181, 0.35);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 22px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 10px var(--teal);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* PALCO CENTRAL UNIFICADO (ONDE TOCA A MÍDIA) */
    .stage-wrapper {
      width: 100%;
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Palco MP3 (Personagem FaçaAmigos Animado) */
    .artwork-stage {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 226, 52, 0.3), rgba(46, 207, 181, 0.2), rgba(26, 63, 53, 0.95));
      border: 4px solid var(--teal);
      box-shadow: 0 0 35px rgba(46, 207, 181, 0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .artwork-stage.playing {
      border-color: var(--pink);
      box-shadow: 0 0 45px rgba(240, 25, 107, 0.45);
      animation: pulseStage 3s infinite alternate ease-in-out;
    }

    @keyframes pulseStage {
      0% { transform: scale(1); box-shadow: 0 0 35px rgba(46, 207, 181, 0.35); }
      100% { transform: scale(1.04); box-shadow: 0 0 50px rgba(240, 25, 107, 0.5); }
    }

    .artwork-char {
      width: 125px;
      height: 125px;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.4));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .artwork-stage.playing .artwork-char {
      animation: bounceChar 1.8s infinite ease-in-out;
    }

    @keyframes bounceChar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }

    /* Palco Suno Embed (Mesmíssimo Espaço Físico) */
    .suno-stage {
      width: 100%;
      max-width: 480px;
      height: 154px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--pink);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      background: #000;
      display: none;
    }

    .suno-stage.active {
      display: block;
    }

    .suno-stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* METADADOS DA MÚSICA */
    .type-pill {
      display: inline-block;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 16px;
      border-radius: 999px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .type-pill.mp3 { background: var(--teal); color: var(--dark); }
    .type-pill.suno { background: var(--pink); color: #fff; }
    .type-pill.ambient { background: var(--yellow); color: var(--dark); }

    .track-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      line-height: 1.15;
      color: var(--white);
      margin-bottom: 8px;
      min-height: 2.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: #9EC0B6;
      margin-bottom: 22px;
    }

    /* BARRA DE PROGRESSO DO MP3 */
    .scrubber-box {
      width: 100%;
      max-width: 480px;
      margin-bottom: 22px;
    }

    .scrubber-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .scrubber-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--pink));
      border-radius: 999px;
      transition: width 0.15s linear;
    }

    .scrubber-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: #9EC0B6;
      margin-top: 6px;
    }

    /* BOTÃO PRINCIPAL DE INÍCIO DIRETO */
    .btn-start-hero {
      width: 100%;
      max-width: 440px;
      padding: 18px 32px;
      background: linear-gradient(135deg, var(--pink), #FF4B8B);
      border: none;
      border-radius: 999px;
      color: var(--white);
      font-family: 'Fredoka One', cursive;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(240, 25, 107, 0.45);
      transition: all 0.25s ease;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-start-hero:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 40px rgba(240, 25, 107, 0.6);
    }

    .btn-start-hero.playing {
      display: none;
    }

    /* CONTROLES UNIFICADOS (APENAS 1 CONJUNTO) */
    .controls-row {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
      width: 100%;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-glass);
      color: var(--white);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.06);
    }

    .ctrl-btn-play {
      width: 76px;
      height: 76px;
      background: var(--pink);
      border: none;
      color: var(--white);
      font-size: 2.2rem;
      box-shadow: 0 8px 24px rgba(240, 25, 107, 0.45);
    }

    .ctrl-btn-play:hover {
      background: var(--pink-dark);
      transform: scale(1.08);
    }

    .ctrl-btn-next {
      width: auto;
      padding: 0 24px;
      border-radius: 999px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.15rem;
      gap: 8px;
      background: rgba(46, 207, 181, 0.2);
      border-color: var(--teal);
      color: var(--teal);
      display: flex;
      align-items: center;
    }

    .ctrl-btn-next:hover {
      background: var(--teal);
      color: var(--dark);
    }

    /* VOLUME */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .volume-slider {
      flex: 1;
      accent-color: var(--teal);
      cursor: pointer;
      height: 6px;
    }

    /* SEÇÃO DISCRETA DE PRÓXIMAS FAIXAS (SEM BOTÕES DE CONFUSÃO) */
    .upcoming-section {
      width: 100%;
      max-width: 660px;
      margin-top: 24px;
      background: rgba(26, 63, 53, 0.6);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 20px 24px;
    }

    .upcoming-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .upcoming-header h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: var(--yellow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upcoming-badge {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--teal);
      background: rgba(46, 207, 181, 0.15);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .upcoming-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 6px;
    }

    .upcoming-list::-webkit-scrollbar { width: 4px; }
    .upcoming-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .upcoming-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.88rem;
      font-weight: 700;
      color: #C0D6CF;
    }

    .upcoming-item.now-playing {
      background: rgba(46, 207, 181, 0.15);
      color: var(--yellow);
      border: 1px solid rgba(46, 207, 181, 0.4);
    }

    .upcoming-item .tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: 'Fredoka', cursive;
    }

    .upcoming-item .tag.mp3 { background: var(--teal-soft); color: var(--teal); }
    .upcoming-item .tag.suno { background: var(--pink-soft); color: var(--pink); }
    .upcoming-item .tag.ambient { background: rgba(255, 226, 52, 0.15); color: var(--yellow); }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: #6C8E84;
      font-weight: 700;
    }

    footer a {
      color: var(--teal);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <!-- BARRA SUPERIOR -->
  <header class="topbar">
    <a href="/tv" class="brand">
      <img src="img/logo-simbolo.png" alt="FaçaAmigos">
      <div class="brand-text">
        <b>FaçaAmigos</b>
        <span>Rádio do Salão</span>
      </div>
    </a>
    <a href="/tv" class="btn-tv">📺 Abrir TV</a>
  </header>

  <!-- PLAYER ÚNICO (SEM CONFUSÃO) -->
  <main class="player-card" aria-label="Player Único de Músicas">
    
    <!-- BADGE DE STATUS -->
    <div class="radio-status-badge">
      <span class="live-dot"></span>
      <span id="radioStatusText">Rádio Contínua • Rodízio 100% Aleatório (89 Faixas)</span>
    </div>

    <!-- PALCO CENTRAL DA MÍDIA (MESMO LUGAR PARA TUDO) -->
    <div class="stage-wrapper" id="stageWrapper">
      <!-- Palco MP3 com Mascote -->
      <div class="artwork-stage active" id="artworkStage">
        <img class="artwork-char" id="artworkChar" src="img/amigos/cachorro-acena.webp" alt="Mascote FaçaAmigos">
      </div>

      <!-- Palco Suno Embed (Mesmíssimo Espaço) -->
      <div class="suno-stage" id="sunoStage">
        <iframe id="sunoFrame" src="about:blank" title="Suno Player" allow="autoplay; encrypted-media"></iframe>
      </div>
    </div>

    <!-- METADADOS DA FAIXA -->
    <div class="type-pill mp3" id="typePill">Rádio FaçaAmigos</div>
    <h1 class="track-title" id="trackTitle">Toque no Botão Abaixo</h1>
    <p class="track-subtitle" id="trackSubtitle">Modo automático contínuo para tocar no salão</p>

    <!-- BARRA DE PROGRESSO DO MP3 -->
    <div class="scrubber-box" id="scrubberBox" style="display:none;">
      <div class="scrubber-track" id="scrubberTrack">
        <div class="scrubber-fill" id="scrubberFill"></div>
      </div>
      <div class="scrubber-times">
        <span id="timeCurrent">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>
    </div>

    <!-- BOTÃO GIGANTE DE INÍCIO DIRETO -->
    <button class="btn-start-hero" id="btnStartRadio">
      ▶ LIGAR RÁDIO (TOCAR DIRETO)
    </button>

    <!-- CONTROLES UNIFICADOS -->
    <div class="controls-row" id="controlsRow">
      <button class="ctrl-btn" id="btnPrev" title="Música Anterior">⏮</button>
      <button class="ctrl-btn ctrl-btn-play" id="btnPlay" title="Pausar / Retomar">⏸</button>
      <button class="ctrl-btn ctrl-btn-next" id="btnNext" title="Próxima Faixa Aleatória">⏭ Próxima</button>
    </div>

    <!-- VOLUME -->
    <div class="volume-row">
      <span id="volumeIcon">🔊</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.85" title="Volume da Rádio">
    </div>
  </main>

  <!-- PRÓXIMAS FAIXAS NO RODÍZIO (APENAS INFORMATIVO) -->
  <section class="upcoming-section" aria-label="Próximas Faixas">
    <div class="upcoming-header">
      <h2>📻 Na Fila da Rádio</h2>
      <span class="upcoming-badge" id="upcomingBadge">89 faixas no rodízio</span>
    </div>
    <div class="upcoming-list" id="upcomingList">
      <!-- Inserido dinamicamente pelo JS -->
    </div>
  </section>

  <footer>
    <p>FaçaAmigos • Parque Shopping Belém • <a href="/tv">Modo TV</a> • <a href="/tv-controle">Controle Celular</a></p>
  </footer>

      // 4. FAIXAS DE FUNDO SALÃO (MP3 Locais em /audio/musica)
      { title: "A Tarde Dourada", file: "audio/musica/a-tarde-dourada.mp3", cat: "ambient" },

      { title: "Ciranda das Cores", file: "audio/musica/ciranda-das-cores.mp3", cat: "ambient" },
      { title: "Dança das Sombras", file: "audio/musica/danca-das-sombras.mp3", cat: "ambient" },
      { title: "Doce Balanço", file: "audio/musica/doce-balanco.mp3", cat: "ambient" },
      { title: "Gotas de Alegria", file: "audio/musica/gotas-de-alegria.mp3", cat: "ambient" },

      { title: "O Mundo É um Jardim", file: "audio/musica/o-mundo-e-um-jardim.mp3", cat: "ambient" },
      { title: "O Nosso Papel", file: "audio/musica/o-nosso-papel.mp3", cat: "ambient" },
      { title: "O Passo Miúdo", file: "audio/musica/o-passo-miudo.mp3", cat: "ambient" },
      { title: "O Playground da Gente", file: "audio/musica/o-playground-da-gente.mp3", cat: "ambient" },
      { title: "Passo Miúdo", file: "audio/musica/passo-miudo.mp3", cat: "ambient" },
      { title: "Small Footsteps on Cedar", file: "audio/musica/small-footsteps-on-cedar.mp3", cat: "ambient" },
      { title: "Sunlight on the Conservatory", file: "audio/musica/sunlight-on-the-conservatory.mp3", cat: "ambient" },
      { title: "Sunlight on the Slide", file: "audio/musica/sunlight-on-the-slide.mp3", cat: "ambient" },
      { title: "The Highest Arc", file: "audio/musica/the-highest-arc.mp3", cat: "ambient" }
    ];

    // ========================================================================
    // ESTADO DA RÁDIO (RODÍZIO RANDÔMICO DIRETO E CONTÍNUO)
    // ========================================================================
    const state = {
      queue: [],
      queueIndex: 0,
      currentIndex: -1,
      isPlaying: false,
      advanceTimer: null
    };

    const audio = new Audio();
    audio.volume = 0.85;

    // ELEMENTOS DO DOM
    const dom = {
      radioStatusText: document.getElementById('radioStatusText'),
      artworkStage: document.getElementById('artworkStage'),
      artworkChar: document.getElementById('artworkChar'),
      sunoStage: document.getElementById('sunoStage'),
      sunoFrame: document.getElementById('sunoFrame'),
      typePill: document.getElementById('typePill'),
      trackTitle: document.getElementById('trackTitle'),
      trackSubtitle: document.getElementById('trackSubtitle'),
      scrubberBox: document.getElementById('scrubberBox'),
      scrubberTrack: document.getElementById('scrubberTrack'),
      scrubberFill: document.getElementById('scrubberFill'),
      timeCurrent: document.getElementById('timeCurrent'),
      timeTotal: document.getElementById('timeTotal'),
      btnStartRadio: document.getElementById('btnStartRadio'),
      controlsRow: document.getElementById('controlsRow'),
      btnPlay: document.getElementById('btnPlay'),
      btnPrev: document.getElementById('btnPrev'),
      btnNext: document.getElementById('btnNext'),
      volumeSlider: document.getElementById('volumeSlider'),
      volumeIcon: document.getElementById('volumeIcon'),
      upcomingBadge: document.getElementById('upcomingBadge'),
      upcomingList: document.getElementById('upcomingList')
    };

    function fmtTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // EMBARALHAR FILA TOTALMENTE RANDÔMICA
    function shuffleQueue() {
      state.queue = Array.from({ length: TRACKS.length }, (_, i) => i);
      for (let i = state.queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.queue[i], state.queue[j]] = [state.queue[j], state.queue[i]];
      }
      state.queueIndex = 0;
    }

    // ATUALIZAR LISTA INFORMATIVA DAS PRÓXIMAS FAIXAS
    function updateUpcomingList() {
      dom.upcomingList.innerHTML = '';
      const total = state.queue.length;
      dom.upcomingBadge.textContent = `${total} faixas no rodízio`;

      // Mostra as próximas faixas da fila
      const start = state.queueIndex;
      const count = Math.min(20, total);

      for (let i = 0; i < count; i++) {
        const qIdx = (start + i) % total;
        const trackIdx = state.queue[qIdx];
        const t = TRACKS[trackIdx];
        const isNow = (i === 0);

        const row = document.createElement('div');
        row.className = 'upcoming-item' + (isNow ? ' now-playing' : '');

        let tagClass = 'mp3';
        let tagText = 'MP3';
        if (t.embed) { tagClass = 'suno'; tagText = 'Suno'; }
        else if (t.cat === 'ambient') { tagClass = 'ambient'; tagText = 'Salão'; }

        row.innerHTML = `
          <span>${isNow ? '▶ ' : `${i + 1}. `}${t.title}</span>
          <span class="tag ${tagClass}">${tagText}</span>
        `;
        dom.upcomingList.appendChild(row);
      }
    }

    // REPRODUÇÃO DA FAIXA NO PLAYER ÚNICO
    function playTrack(idx) {
      clearTimeout(state.advanceTimer);
      state.currentIndex = idx;
      const t = TRACKS[idx];

      dom.trackTitle.textContent = t.title;

      let pillClass = 'mp3';
      let pillText = 'Faixa Oficial FaçaAmigos';
      let subText = 'Áudio estéreo de alta fidelidade';

      if (t.embed) {
        pillClass = 'suno';
        pillText = 'Coleção FaçaAmigos (Suno)';
        subText = 'Rotação automática da rádio';
      } else if (t.cat === 'ambient') {
        pillClass = 'ambient';
        pillText = 'Fundo Musical do Salão';
        subText = 'Trilha instrumental relaxante';
      }

      dom.typePill.className = `type-pill ${pillClass}`;
      dom.typePill.textContent = pillText;
      dom.trackSubtitle.textContent = subText;
      dom.radioStatusText.textContent = `🟢 Rádio no Ar • Faixa ${state.queueIndex + 1} de ${TRACKS.length}`;

      dom.btnStartRadio.classList.add('playing');
      dom.controlsRow.style.display = 'flex';

      // ======================================================================
      // UM ÚNICO PLAYER: O SLOT CENTRAL ADAPTA-SE SEM DUPLICAR CONTROLES
      // ======================================================================
      if (t.embed) {
        // Se for Suno: Carrega o embed no mesmo palco central
        audio.pause();
        dom.scrubberBox.style.display = 'none';

        dom.artworkStage.style.display = 'none';
        dom.sunoStage.classList.add('active');
        if (dom.sunoFrame.src !== t.embed) {
          dom.sunoFrame.src = t.embed;
        }

        state.isPlaying = true;
        updatePlayBtn();

        // Avanço automático contínuo para Suno (~2m15s / 135s)
        state.advanceTimer = setTimeout(() => {
          nextTrack();
        }, 135000);

      } else {
        // Se for MP3: Mostra o palco com mascote e toca áudio nativo
        dom.sunoStage.classList.remove('active');
        dom.sunoFrame.src = 'about:blank';

        dom.artworkStage.style.display = 'flex';
        dom.artworkChar.src = `img/amigos/${t.char || 'cachorro-acena'}.webp`;
        dom.scrubberBox.style.display = 'block';

        const src = t.file;
        if (!decodeURI(audio.src).endsWith(src)) {
          audio.src = src;
        }

        const p = audio.play();
        if (p && p.catch) {
          p.then(() => {
            state.isPlaying = true;
            updatePlayBtn();
            dom.artworkStage.classList.add('playing');
          }).catch(() => {
            state.isPlaying = false;
            updatePlayBtn();
            dom.artworkStage.classList.remove('playing');
          });
        } else {
          state.isPlaying = true;
          updatePlayBtn();
          dom.artworkStage.classList.add('playing');
        }
      }

      updateUpcomingList();
    }

    // ALTERNAR PLAY/PAUSE
    function togglePlay() {
      const t = TRACKS[state.currentIndex];
      if (t.embed) {
        state.isPlaying = !state.isPlaying;
        updatePlayBtn();
        if (!state.isPlaying) {
          clearTimeout(state.advanceTimer);
        } else {
          state.advanceTimer = setTimeout(nextTrack, 135000);
        }
        return;
      }

      if (audio.paused) {
        audio.play().then(() => {
          state.isPlaying = true;
          updatePlayBtn();
          dom.artworkStage.classList.add('playing');
        }).catch(console.warn);
      } else {
        audio.pause();
        state.isPlaying = false;
        updatePlayBtn();
        dom.artworkStage.classList.remove('playing');
      }
    }

    function updatePlayBtn() {
      dom.btnPlay.textContent = state.isPlaying ? '⏸' : '▶';
    }

    // AVANÇAR PARA A PRÓXIMA FAIXA (RODÍZIO ALEATÓRIO DIRETO)
    function nextTrack() {
      state.queueIndex++;
      if (state.queueIndex >= state.queue.length) {
        shuffleQueue();
      }
      playTrack(state.queue[state.queueIndex]);
    }

    function prevTrack() {
      state.queueIndex--;
      if (state.queueIndex < 0) {
        state.queueIndex = state.queue.length - 1;
      }
      playTrack(state.queue[state.queueIndex]);
    }

    // EVENTOS DO ÁUDIO MP3
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        dom.scrubberFill.style.width = percent + '%';
        dom.timeCurrent.textContent = fmtTime(audio.currentTime);
        dom.timeTotal.textContent = fmtTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      dom.timeTotal.textContent = fmtTime(audio.duration);
    });

    // Quando o áudio MP3 termina -> imediatamente toca a próxima música aleatória!
    audio.addEventListener('ended', () => {
      nextTrack();
    });

    audio.addEventListener('error', (err) => {
      console.warn('Erro ao carregar faixa, pulando para a próxima...', err);
      nextTrack();
    });

    // SCRUBBER
    dom.scrubberTrack.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = dom.scrubberTrack.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pos * audio.duration;
    });

    // VOLUME
    dom.volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      audio.volume = val;
      dom.volumeIcon.textContent = val === 0 ? '🔇' : (val < 0.5 ? '🔉' : '🔊');
    });

    // BOTÃO ÚNICO DE LIGAR RÁDIO (1 CLIQUE PARA O OPERADOR)
    dom.btnStartRadio.addEventListener('click', () => {
      shuffleQueue();
      playTrack(state.queue[0]);
    });

    // CONTROLES UNIFICADOS
    dom.btnPlay.addEventListener('click', togglePlay);
    dom.btnNext.addEventListener('click', nextTrack);
    dom.btnPrev.addEventListener('click', prevTrack);

    // ATALHOS DE TECLADO
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!state.isPlaying && dom.btnStartRadio.offsetParent !== null) {
          shuffleQueue();
          playTrack(state.queue[0]);
        } else {
          togglePlay();
        }
      } else if (e.key === 'm' || e.key === 'M' || e.key === 'ArrowRight') {
        nextTrack();
      } else if (e.key === 'ArrowLeft') {
        prevTrack();
      }
    });

    // INICIALIZAÇÃO
    shuffleQueue();
    updateUpcomingList();
  </script>
