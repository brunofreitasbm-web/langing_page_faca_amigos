<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="/assets/fa-track.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FaçaAmigos TV — Vitrine Digital e Cultura</title>
  <meta name="description" content="Vitrine Digital e Canal Interno das operações FaçaAmigos no Parque Shopping Belém.">
  <link rel="canonical" href="https://institutofacaamigos.com.br/tv">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="img/logo-simbolo.png">

  <!-- Fontes Oficiais da Marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #F0196B;
      --pink-dark: #C81158;
      --pink-soft: rgba(240, 25, 107, 0.12);
      --teal: #2ECFB5;
      --teal-dark: #1FA893;
      --teal-soft: rgba(46, 207, 181, 0.15);
      --yellow: #FFE234;
      --yellow-gold: #F59E0B;
      --dark: #1A3F35;
      --dark-card: #122822;
      --ink-soft: #4C6B62;
      --cream: #FFF9F1;
      --white: #FFFFFF;
      --shadow-lg: 0 20px 50px rgba(26, 63, 53, 0.18);
      --shadow-glow: 0 0 40px rgba(240, 25, 107, 0.35);
      --r-xl: 36px;
      --r-lg: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--cream);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--dark);
      cursor: default;
    }

    body.hide-cursor {
      cursor: none !important;
    }

    /* ==========================================================================
       TOPBAR PERMANENTE (Smart TV Safe Area)
       ========================================================================== */
    .tv-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10vh;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4vw;
      z-index: 100;
      background: linear-gradient(180deg, rgba(255,249,241,0.95) 0%, rgba(255,249,241,0.7) 75%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .tv-brand {
      display: flex;
      align-items: center;
      gap: 1.2vw;
    }

    .tv-logo-img {
      width: clamp(48px, 4.5vw, 70px);
      height: clamp(48px, 4.5vw, 70px);
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(240, 25, 107, 0.25));
    }

    .tv-brand-text {
      display: flex;
      flex-direction: column;
    }

    .tv-brand-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.4rem, 2vw, 2.4rem);
      color: var(--pink);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .tv-brand-sub {
      font-family: 'Fredoka', cursive;
      font-size: clamp(0.75rem, 1vw, 1.1rem);
      color: var(--teal-dark);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    .tv-status-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 16px rgba(26, 63, 53, 0.08);
      border: 1px solid rgba(240, 25, 107, 0.15);
      font-family: 'Fredoka', cursive;
      font-weight: 600;
      font-size: clamp(0.85rem, 1.15vw, 1.3rem);
      color: var(--dark);
    }

    .tv-status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 10px var(--teal);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    .tv-cycle-badge {
      background: var(--teal-soft);
      color: var(--teal-dark);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.85em;
      font-weight: 700;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }

    .tv-clock {
      text-align: right;
    }

    .tv-clock-time {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.8rem, 2.8vw, 3.2rem);
      color: var(--dark);
      line-height: 1;
    }

    .tv-clock-date {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(0.75rem, 0.95vw, 1.1rem);
      color: var(--ink-soft);
      font-weight: 700;
      text-transform: capitalize;
    }

    /* ==========================================================================
       CONTAINER PRINCIPAL DOS MODOS
       ========================================================================== */
    .tv-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
    }

    .tv-screen.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* ==========================================================================
       TURNO 1: EQUIPE & ACOLHIMENTO (10h - 16h)
       ========================================================================== */
    #mode-team {
      background: radial-gradient(circle at 15% 20%, rgba(46, 207, 181, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 85% 80%, rgba(240, 25, 107, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, #FFFDF9 0%, #FFF4E5 100%);
    }

    .team-container {
      width: 100%;
      height: 100%;
      padding: 12vh 4vw 6vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-host {
      position: absolute;
      width: 92vw;
      height: 78vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 4vw;
      align-items: center;
      opacity: 0;
      transform: scale(0.97) translateY(20px);
      transition: opacity 0.9s ease-out, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }

    .slide-host.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .team-content {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2vh, 26px);
      justify-content: center;
    }

    .team-tag {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      border-radius: 999px;
      background: var(--pink-soft);
      border: 1px solid rgba(240, 25, 107, 0.25);
      color: var(--pink);
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: clamp(0.85rem, 1.2vw, 1.35rem);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .team-quote {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: clamp(1.9rem, 3.2vw, 4.2rem);
      line-height: 1.2;
      color: var(--dark);
      letter-spacing: -0.8px;
    }

    .team-quote span.highlight {
      color: var(--pink);
      position: relative;
      display: inline-block;
    }

    .team-quote span.highlight-teal {
      color: var(--teal-dark);
    }

    .team-subtext {
      font-size: clamp(1.1rem, 1.55vw, 1.9rem);
      line-height: 1.45;
      color: var(--ink-soft);
      font-weight: 600;
      max-width: 92%;
    }

    .team-pill-box {
      margin-top: 1vh;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(46, 207, 181, 0.35);
      box-shadow: 0 8px 24px rgba(26, 63, 53, 0.05);
      width: fit-content;
    }

    .team-pill-icon {
      font-size: clamp(1.5rem, 2vw, 2.4rem);
    }

    .team-pill-text {
      font-size: clamp(0.95rem, 1.2vw, 1.4rem);
      font-weight: 700;
      color: var(--dark);
    }

    .team-media-card {
      position: relative;
      width: 100%;
      height: 72vh;
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 6px solid var(--white);
      background: #e2edea;
    }

    .team-media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 14s ease-out;
    }

    .slide-host.active .team-media-card img {
      transform: scale(1.12);
    }

    .team-media-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px;
      background: linear-gradient(0deg, rgba(26, 63, 53, 0.88) 0%, rgba(26, 63, 53, 0) 100%);
      color: var(--white);
    }

    .team-media-label {
      font-family: 'Fredoka', cursive;
      font-size: clamp(1rem, 1.3vw, 1.6rem);
      font-weight: 600;
      color: var(--yellow);
    }

    .team-media-caption {
      font-size: clamp(0.85rem, 1vw, 1.2rem);
      opacity: 0.9;
      margin-top: 4px;
    }

    /* ==========================================================================
       TURNO 2: CRIANÇAS & VITRINE DIGITAL (16h - 22h)
       ========================================================================== */
    #mode-kids {
      background: radial-gradient(circle at 10% 15%, rgba(255, 226, 52, 0.25) 0%, transparent 40%),
                  radial-gradient(circle at 90% 20%, rgba(240, 25, 107, 0.2) 0%, transparent 45%),
                  radial-gradient(circle at 50% 85%, rgba(46, 207, 181, 0.22) 0%, transparent 55%),
                  #FFFDF7;
    }

    .kids-container {
      width: 100%;
      height: 100%;
      padding: 12vh 4vw 6vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .kids-slide-host {
      position: absolute;
      width: 92vw;
      height: 78vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4vw;
      align-items: center;
      opacity: 0;
      transform: scale(0.96) translateX(40px);
      transition: opacity 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }

    .kids-slide-host.active {
      opacity: 1;
      transform: scale(1) translateX(0);
      pointer-events: auto;
    }

    .kids-content {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 2.2vh, 30px);
      justify-content: center;
    }

    .kids-badge-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .kids-badge {
      padding: 8px 22px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: clamp(0.9rem, 1.25vw, 1.45rem);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .badge-pink {
      background: var(--pink);
      color: var(--white);
    }

    .badge-yellow {
      background: var(--yellow);
      color: var(--dark);
    }

    .badge-teal {
      background: var(--teal);
      color: var(--dark);
    }

    .kids-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.3rem, 4.2vw, 5.4rem);
      line-height: 1.1;
      color: var(--dark);
      letter-spacing: -1px;
    }

    .kids-title span.pop {
      color: var(--pink);
      text-shadow: 0 4px 20px rgba(240, 25, 107, 0.2);
    }

    .kids-desc {
      font-size: clamp(1.15rem, 1.75vw, 2.1rem);
      line-height: 1.4;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .kids-feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 1vh;
    }

    .kids-feature-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(1.05rem, 1.4vw, 1.65rem);
      font-weight: 800;
      color: var(--dark);
    }

    .kids-feature-icon {
      width: clamp(34px, 2.8vw, 46px);
      height: clamp(34px, 2.8vw, 46px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      box-shadow: 0 6px 16px rgba(26, 63, 53, 0.1);
      font-size: clamp(1.1rem, 1.5vw, 1.8rem);
      flex-shrink: 0;
    }

    .kids-visual-card {
      position: relative;
      width: 100%;
      height: 72vh;
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      border: 8px solid var(--white);
      background: #fedbe9;
    }

    .kids-visual-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
      transition: transform 10s ease-out;
    }

    .kids-slide-host.active .kids-visual-card img {
      transform: scale(1.12);
    }

    .kids-sticker {
      position: absolute;
      top: 24px;
      right: 24px;
      background: var(--yellow);
      color: var(--dark);
      padding: 14px 24px;
      border-radius: 999px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.1rem, 1.5vw, 1.8rem);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      transform: rotate(4deg);
      animation: float-sticker 3s ease-in-out infinite alternate;
    }

    @keyframes float-sticker {
      0% { transform: rotate(3deg) translateY(0); }
      100% { transform: rotate(-3deg) translateY(-8px); }
    }

    .kids-sticker-bottom {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 26px;
      border-radius: 20px;
      border: 2px solid var(--pink);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(26, 63, 53, 0.15);
    }

    .kids-sticker-bottom-icon {
      font-size: clamp(1.6rem, 2.2vw, 2.6rem);
    }

    .kids-sticker-bottom-text {
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: clamp(1rem, 1.35vw, 1.6rem);
      color: var(--dark);
    }

    /* ==========================================================================
       TURNO 3: STAND-BY NOTURNO (22h - 10h)
       ========================================================================== */
    #mode-night {
      background: radial-gradient(circle at 50% 50%, #15322A 0%, #0A1B16 100%);
      color: var(--white);
    }

    .night-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3vh;
      padding: 4vw;
    }

    .night-logo-wrap {
      width: clamp(90px, 10vw, 150px);
      height: clamp(90px, 10vw, 150px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(46, 207, 181, 0.2);
      animation: breathe 5s infinite ease-in-out;
    }

    .night-logo-wrap img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .night-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.4rem, 4.5vw, 5.5rem);
      color: var(--cream);
      letter-spacing: -0.5px;
    }

    .night-sub {
      font-size: clamp(1.2rem, 1.9vw, 2.4rem);
      color: rgba(255, 255, 255, 0.7);
      max-width: 700px;
      line-height: 1.4;
    }

    .night-hours {
      margin-top: 2vh;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 36px;
      border-radius: 999px;
      background: rgba(46, 207, 181, 0.15);
      border: 1px solid rgba(46, 207, 181, 0.35);
      font-family: 'Fredoka', cursive;
      font-size: clamp(1.2rem, 1.8vw, 2.2rem);
      color: var(--teal);
    }

    /* ==========================================================================
       PROGRESS BAR INFERIOR (Ciclo dos Slides)
       ========================================================================== */
    .tv-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(26, 63, 53, 0.08);
      z-index: 100;
    }

    .tv-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--pink));
      transition: width 0.1s linear;
    }

    /* ==========================================================================
       CONTROLES OCULTOS / HUD (Aparece com mouse ou toque)
       ========================================================================== */
    .tv-hud {
      position: absolute;
      bottom: 24px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(26, 63, 53, 0.78);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      z-index: 200;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    body:not(.hide-cursor) .tv-hud,
    .tv-hud:hover {
      opacity: 1;
      transform: translateY(0);
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .hud-btn:hover, .hud-btn.active {
      background: var(--pink);
      border-color: var(--pink);
      color: var(--white);
      transform: scale(1.05);
    }

    /* ==========================================================================
       ROADMAP: CAMADA DE JOGOS INTERATIVOS
       ========================================================================== */
    #game-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(26, 63, 53, 0.95);
      backdrop-filter: blur(14px);
      z-index: 500;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--white);
    }

    #game-layer.active {
      display: flex;
    }

    .game-box {
      width: 90vw;
      max-width: 1200px;
      height: 80vh;
      background: var(--cream);
      border-radius: var(--r-xl);
      border: 8px solid var(--yellow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.5);
      color: var(--dark);
      position: relative;
    }

    .game-header {
      padding: 20px 30px;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(26, 63, 53, 0.08);
    }

    .game-header-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem;
      color: var(--pink);
    }

    .game-close-btn {
      background: #ff4757;
      color: var(--white);
      border: none;
      padding: 8px 20px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .game-canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #FFF5EC 100%);
    }

    .bubble-target {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      color: var(--white);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      cursor: pointer;
      user-select: none;
      animation: float-up linear forwards;
    }

    @keyframes float-up {
      0% { transform: translateY(85vh) scale(0.8); opacity: 0; }
      10% { opacity: 1; transform: translateY(75vh) scale(1); }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
    }

    .game-score-badge {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      color: var(--teal-dark);
      background: var(--teal-soft);
      padding: 6px 18px;
      border-radius: 999px;
    }
  </style>
</head>

<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NPDJ58XR" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- ========================================================================
       TOPBAR PERMANENTE (Informações do Cabeçalho)
       ======================================================================== -->
  <header class="tv-header" id="tvHeader">
    <div class="tv-brand">
      <img src="img/logo-simbolo.png" alt="FaçaAmigos" class="tv-logo-img" width="70" height="70">
      <div class="tv-brand-text">
        <span class="tv-brand-title">FaçaAmigos</span>
        <span class="tv-brand-sub" id="tvSubTitle">Playground Inclusivo • Circuito • Clínica</span>
      </div>
    </div>

    <div class="tv-status-badge">
      <span class="tv-status-dot" id="statusDot"></span>
      <span id="statusText">Modo Equipe</span>

      function shuffleArray(array) {
        const copy = [...array];

      // ----------------------------------------------------------------------
      function renderTeamSlides(cycleDay) {
        const rawSlides = FACA_AMIGOS_DATABASE.team[cycleDay] || FACA_AMIGOS_DATABASE.team[1];
        // Aplica randomização (shuffle)
        state.currentPool = shuffleArray(rawSlides);
        dom.teamContainer.innerHTML = '';

        state.currentPool.forEach((slide, idx) => {
          const slideEl = document.createElement('div');
          slideEl.className = 'slide-host' + (idx === 0 ? ' active' : '');
          slideEl.setAttribute('data-slide', idx);

          const loadingAttr = idx === 0 ? 'loading="eager"' : 'loading="lazy"';

          slideEl.innerHTML = `
            <div class="team-content">
              <div class="team-tag">${slide.tag}</div>
              <h1 class="team-quote">${slide.title}</h1>
              <p class="team-subtext">${slide.subtext}</p>
              <div class="team-pill-box">
                <span class="team-pill-icon">${slide.pillIcon}</span>
                <span class="team-pill-text">${slide.pillText}</span>
              </div>
            </div>
            <div class="team-media-card">
              <picture>
                <source srcset="${slide.imageWebp}" type="image/webp">
                <img src="${slide.imageJpg}" alt="${slide.imageAlt}" width="800" height="600" ${loadingAttr} decoding="async">
              </picture>
              <div class="team-media-overlay">
                <div class="team-media-label">${slide.label}</div>
                <div class="team-media-caption">${slide.caption}</div>
              </div>
            </div>
          `;

          dom.teamContainer.appendChild(slideEl);
        });
      }

      function renderKidsSlides(cycleDay) {
        const rawSlides = FACA_AMIGOS_DATABASE.kids[cycleDay] || FACA_AMIGOS_DATABASE.kids[1];
        // Aplica randomização (shuffle)
        state.currentPool = shuffleArray(rawSlides);
        dom.kidsContainer.innerHTML = '';

        state.currentPool.forEach((slide, idx) => {
          const slideEl = document.createElement('div');
          slideEl.className = 'kids-slide-host' + (idx === 0 ? ' active' : '');
          slideEl.setAttribute('data-slide', idx);

          const badgesHtml = slide.badges.map((b, i) => {
            const cls = i === 0 ? 'badge-pink' : 'badge-yellow';
            return `<span class="kids-badge ${cls}">${b}</span>`;
          }).join('');

          const featuresHtml = slide.features.map(f => `
            <div class="kids-feature-item">
              <span class="kids-feature-icon">${f.icon}</span>
              <span>${f.text}</span>
            </div>
          `).join('');

          const loadingAttr = idx === 0 ? 'loading="eager"' : 'loading="lazy"';

          slideEl.innerHTML = `
            <div class="kids-content">
              <div class="kids-badge-row">${badgesHtml}</div>
              <h1 class="kids-title">${slide.title}</h1>
              <p class="kids-desc">${slide.desc}</p>
              <div class="kids-feature-list">${featuresHtml}</div>
            </div>
            <div class="kids-visual-card">
              <picture>
                <source srcset="${slide.imageWebp}" type="image/webp">
                <img src="${slide.imageJpg}" alt="${slide.imageAlt}" width="800" height="600" ${loadingAttr} decoding="async">
              </picture>
              <div class="kids-sticker">${slide.sticker}</div>
              <div class="kids-sticker-bottom">
                <span class="kids-sticker-bottom-icon">${slide.bottomIcon}</span>
                <div class="kids-sticker-bottom-text">${slide.bottomText}</div>
              </div>
            </div>
          `;

          dom.kidsContainer.appendChild(slideEl);
        });
      }

      // ----------------------------------------------------------------------
      // RELÓGIO E AVALIAÇÃO DE HORÁRIOS
      // ----------------------------------------------------------------------
      function updateClock() {
        const now = new Date();
        const belem = belemNow();
        const hours = String(belem.hours).padStart(2, '0');
        const minutes = String(belem.minutes).padStart(2, '0');
        dom.clockTime.textContent = `${hours}:${minutes}`;

        const options = { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Belem' };
        try {
          dom.clockDate.textContent = now.toLocaleDateString('pt-BR', options);
        } catch (e) {
          delete options.timeZone; // navegador de TV antigo sem suporte a timeZone
          dom.clockDate.textContent = now.toLocaleDateString('pt-BR', options);
        }

        // Recarrega 1x por dia durante o stand-by (06h) para puxar atualizações e liberar memória
        if (state.currentMode === 'night' && belem.hours === 6 && belem.dayIndex !== state.bootDayIndex) {
          location.reload();
          return;
        }

        // Atualiza dia do ciclo se mudou a meia-noite
        const autoCycle = calculateCurrentCycleDay();
        if (state.forcedCycleDay === undefined && autoCycle !== state.cycleDay) {
          state.cycleDay = autoCycle;
          renderCurrentModeSlides();
        }

        dom.cycleBadge.textContent = `Dia ${state.cycleDay}/5`;

        // Se estiver em modo automático, gerencia o turno pelo horário
        if (!state.forcedMode) {
          evaluateAutoMode(belem.hours);
        }
      }

      function evaluateAutoMode(currentHour) {
        let desiredMode = 'team';

        if (currentHour >= 10 && currentHour < 16) {
          desiredMode = 'team'; // 10h00 às 15h59 -> Equipe & Acolhimento
        } else if (currentHour >= 16 && currentHour < 22) {
          desiredMode = 'kids'; // 16h00 às 21h59 -> Crianças & Vitrine Digital
        } else {
          desiredMode = 'night'; // 22h00 às 09h59 -> Stand-by Noturno
        }

        if (desiredMode !== state.currentMode) {
          switchMode(desiredMode);
        }
      }

      function renderCurrentModeSlides() {
        if (state.currentMode === 'team') {
          renderTeamSlides(state.cycleDay);
        } else if (state.currentMode === 'kids') {
          renderKidsSlides(state.cycleDay);
        }
      }

      // ----------------------------------------------------------------------
      // TRANSIÇÃO DE MODOS
      // ----------------------------------------------------------------------
      function switchMode(newMode) {
        state.currentMode = newMode;
        state.currentSlideIndex = 0;

        clearTimeout(state.slideTimer);
        cancelAnimationFrame(state.progressTimer);
        dom.progressFill.style.width = '0%';

        dom.screenTeam.classList.remove('active');
        dom.screenKids.classList.remove('active');
        dom.screenNight.classList.remove('active');

        if (newMode === 'team') {
          renderTeamSlides(state.cycleDay);
          dom.screenTeam.classList.add('active');
          dom.statusText.textContent = 'Modo Equipe';
          dom.statusDot.style.background = 'var(--teal)';
          dom.statusDot.style.boxShadow = '0 0 10px var(--teal)';
          state.currentSlideDuration = CONFIG.teamSlideDuration;
          startSlideCycle();
        } else if (newMode === 'kids') {
          renderKidsSlides(state.cycleDay);
          dom.screenKids.classList.add('active');
          dom.statusText.textContent = 'Vitrine Crianças';
          dom.statusDot.style.background = 'var(--pink)';
          dom.statusDot.style.boxShadow = '0 0 10px var(--pink)';
          state.currentSlideDuration = CONFIG.kidsSlideDuration;
          startSlideCycle();
        } else {
          dom.screenNight.classList.add('active');
          dom.statusText.textContent = 'Stand-by Noturno';
          dom.statusDot.style.background = '#8B5CF6';
          dom.statusDot.style.boxShadow = '0 0 10px #8B5CF6';
          dom.progressFill.style.width = '0%';
        }

        updateHudButtons();
      }

      // ----------------------------------------------------------------------
      // CICLO DE SLIDES & BARRA DE PROGRESSO
      // ----------------------------------------------------------------------
      function startSlideCycle() {
        clearTimeout(state.slideTimer);
        cancelAnimationFrame(state.progressTimer);

        state.progressStartTime = performance.now();
        animateProgressBar();

        state.slideTimer = setTimeout(() => {
          advanceSlide();
          startSlideCycle();
        }, state.currentSlideDuration);
      }

      function advanceSlide() {
        const activeContainer = state.currentMode === 'team' ? dom.teamContainer : dom.kidsContainer;
        const slides = activeContainer.querySelectorAll('[data-slide]');
        if (slides.length <= 1) return;

        slides[state.currentSlideIndex].classList.remove('active');
        state.currentSlideIndex = (state.currentSlideIndex + 1) % slides.length;
        
        // Se deu uma volta completa no pool, reembaralha para a próxima volta não ser igual
        if (state.currentSlideIndex === 0) {
          renderCurrentModeSlides();
        } else {
          slides[state.currentSlideIndex].classList.add('active');
        }
      }

      function animateProgressBar() {
        const now = performance.now();
        const elapsed = now - state.progressStartTime;
        const percent = Math.min(100, (elapsed / state.currentSlideDuration) * 100);
        dom.progressFill.style.width = percent + '%';

        if (percent < 100 && (state.currentMode === 'team' || state.currentMode === 'kids')) {
          state.progressTimer = requestAnimationFrame(animateProgressBar);
        }
      }

      // ----------------------------------------------------------------------
      // CURSOR AUTO-HIDE
      // ----------------------------------------------------------------------
      let cursorTimeout;
      function resetCursorTimer() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimeout);
        cursorTimeout = setTimeout(() => {
          if (!state.gameActive) {
            document.body.classList.add('hide-cursor');
          }
        }, CONFIG.inactivityTimeout);
      }
      window.addEventListener('mousemove', resetCursorTimer);
      window.addEventListener('touchstart', resetCursorTimer, { passive: true });
      resetCursorTimer();

      // ----------------------------------------------------------------------
      // CONTROLES HUD & ATALHOS DE TECLADO
      // ----------------------------------------------------------------------
      function updateHudButtons() {
        dom.btnModeTeam.classList.toggle('active', state.forcedMode === 'team');
        dom.btnModeKids.classList.toggle('active', state.forcedMode === 'kids');
        dom.btnModeAuto.classList.toggle('active', state.forcedMode === null);
      }

      dom.btnModeTeam.addEventListener('click', () => {
        state.forcedMode = 'team';
        switchMode('team');
      });

      dom.btnModeKids.addEventListener('click', () => {
        state.forcedMode = 'kids';
        switchMode('kids');
      });

      dom.btnModeAuto.addEventListener('click', () => {
        state.forcedMode = null;
        state.forcedCycleDay = undefined;
        updateClock();
        updateHudButtons();
      });

      function setCycleDay(d) {
        state.cycleDay = ((d - 1 + 5) % 5) + 1;
        state.forcedCycleDay = state.cycleDay; // impede o relógio de desfazer a escolha manual no segundo seguinte
        dom.cycleBadge.textContent = `Dia ${state.cycleDay}/5`;
        renderCurrentModeSlides();
        startSlideCycle();
      }

      dom.btnCyclePrev.addEventListener('click', () => setCycleDay(state.cycleDay - 1));
      dom.btnCycleNext.addEventListener('click', () => setCycleDay(state.cycleDay + 1));

      dom.btnFullscreen.addEventListener('click', toggleFullscreen);

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key.toUpperCase();
        if (key === '1') {
          state.forcedMode = 'team';
          switchMode('team');
        } else if (key === '2') {
          state.forcedMode = 'kids';
          switchMode('kids');
        } else if (key === '0' || key === 'A') {
          state.forcedMode = null;
          state.forcedCycleDay = undefined;
          updateClock();
          updateHudButtons();
        } else if (key === '[') {
          setCycleDay(state.cycleDay - 1);
        } else if (key === ']') {
          setCycleDay(state.cycleDay + 1);
        } else if (key === 'F') {
          toggleFullscreen();
        } else if (key === 'G') {
          toggleGame();
        } else if (key === 'ESCAPE' && state.gameActive) {
          toggleGame();
        }
      });

      document.body.addEventListener('dblclick', (e) => {
        if (!e.target.closest('#tvHud') && !e.target.closest('#game-layer')) {
          toggleFullscreen();
        }
      });

      // ----------------------------------------------------------------------
      // MINI-GAME INTERATIVO (ROADMAP)
      // ----------------------------------------------------------------------
      const bubbleColors = ['#F0196B', '#2ECFB5', '#FFE234', '#8B5CF6', '#FF7A00'];

      function toggleGame() {
        state.gameActive = !state.gameActive;

        if (state.gameActive) {
          dom.gameLayer.classList.add('active');
          state.gameScore = 0;
          dom.gameScoreText.textContent = 'Pontos: 0';
          clearTimeout(state.slideTimer);
          cancelAnimationFrame(state.progressTimer);
          startGameSession();
        } else {
          dom.gameLayer.classList.remove('active');
          stopGameSession();
          startSlideCycle();
        }
      }

      function startGameSession() {
        dom.gameCanvas.innerHTML = '';
        state.gameSpawner = setInterval(spawnBubble, 1100);
        resetGameInactivity();
      }

      function stopGameSession() {
        clearInterval(state.gameSpawner);
        clearTimeout(state.gameInactivityTimer);
        dom.gameCanvas.innerHTML = '';
      }

      function resetGameInactivity() {
        clearTimeout(state.gameInactivityTimer);
        state.gameInactivityTimer = setTimeout(() => {
          if (state.gameActive) toggleGame();
        }, 30000);
      }

      function spawnBubble() {
        if (!state.gameActive) return;
        const bubble = document.createElement('div');
        bubble.className = 'bubble-target';

        const size = Math.floor(Math.random() * 50) + 70;
        const left = Math.floor(Math.random() * (dom.gameCanvas.clientWidth - size - 20)) + 10;
        const color = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
        const duration = (Math.random() * 3 + 5).toFixed(1);

        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = left + 'px';
        bubble.style.background = color;
        bubble.style.animationDuration = duration + 's';
        bubble.innerHTML = '⭐';
        bubble.style.fontSize = (size * 0.4) + 'px';

        bubble.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          popBubble(bubble);
        });

        dom.gameCanvas.appendChild(bubble);

        setTimeout(() => {
          if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, duration * 1000);
      }

      function popBubble(bubble) {
        resetGameInactivity();
        state.gameScore += 10;
        dom.gameScoreText.textContent = `Pontos: ${state.gameScore}`;

        bubble.style.transform = 'scale(1.4)';
        bubble.style.opacity = '0';
        bubble.style.transition = 'all 0.15s ease-out';
        setTimeout(() => {
          if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, 150);
      }

      dom.btnGameToggle.addEventListener('click', toggleGame);
      dom.btnGameClose.addEventListener('click', toggleGame);
      dom.gameCanvas.addEventListener('pointerdown', resetGameInactivity);

      window.FacaAmigosTV = {
        switchMode: switchMode,
        setCycleDay: setCycleDay,
        toggleFullscreen: toggleFullscreen,
        launchGame: toggleGame,
        getState: () => state
      };

      // Inicialização: o 1º updateClock() já ativa o turno do horário e inicia o ciclo de slides
      updateClock();
      setInterval(updateClock, CONFIG.timeCheckInterval);
    })();
  </script>
</body>

</html>
