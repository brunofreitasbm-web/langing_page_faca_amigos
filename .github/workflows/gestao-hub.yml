name: Testes do Hub de Gestão
on:
  pull_request:
    paths:
      - 'supabase/functions/gestao-hub/**'
      - 'supabase/tests/gestao-hub/**'
      - 'supabase/functions/recuperar-senha/**'
      - 'supabase/tests/recuperar-senha/**'
      - '.github/workflows/gestao-hub.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/gestao-hub/**'
      - 'supabase/tests/gestao-hub/**'
      - 'supabase/functions/recuperar-senha/**'
      - 'supabase/tests/recuperar-senha/**'
      - '.github/workflows/gestao-hub.yml'
permissions:
  contents: read
concurrency:
  group: gestao-hub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Supabase e Cacau simulados em memória (supabase/tests/gestao-hub/fake_supabase.ts): nada sai do runner.
      # --no-check: o fake não reproduz os tipos do supabase-js; a função é tipada no deploy.
      - name: Provisionar, desligar e religar (fases 2 e 3)
        run: deno test --no-check --config supabase/tests/gestao-hub/deno.json --allow-env supabase/tests/gestao-hub
      - name: Esqueci minha senha (Clínica e Gestão de Pessoas)
        run: deno test --no-check --config supabase/tests/recuperar-senha/deno.json --allow-env supabase/tests/recuperar-senha
