name: Verificação do site

on:
  push:
    branches: [main]
  pull_request:

# Evita rodar duas vezes (push + PR) e cancela runs antigos do mesmo branch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar páginas, links e JSON-LD
        run: node scripts/check.mjs
      - name: Verificar llms.txt/llms-full.txt contra o snapshot do quiosque
        run: node scripts/geo-build.mjs --check
