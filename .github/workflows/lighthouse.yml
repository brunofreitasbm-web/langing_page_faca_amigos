name: Lighthouse (velocidade, SEO e acessibilidade)

# Mede /, /playground e /circuito a cada PR que mexe em página ou asset.
# Começa só avisando (warn); depois de algumas semanas de histórico, trocar para "error" no lighthouserc.json.
on:
  pull_request:
    paths: ['**.html', 'assets/**', 'img/**', 'lighthouserc.json']
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
